<svg width="640" height="200" viewBox="0 0 640 200" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>XenonSec</title>
  <desc>XenonSec logo: a hexagonal shield mark built from an interlocking bytecode "X", next to the XenonSec wordmark.</desc>

  <!-- ================= ICON ================= -->
  <g transform="translate(20,20)">
    <!-- outer hex "chip / VM boundary" -->
    <polygon points="80,4 148,42 148,118 80,156 12,118 12,42"
             fill="none" stroke="#5B3CFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- inner hex, faint, suggests a nested sandboxed VM -->
    <polygon points="80,26 128,53 128,107 80,134 32,107 32,53"
             fill="none" stroke="#5B3CFF" stroke-width="1.5" stroke-opacity="0.35"/>

    <!-- interlocking bytecode "X" made of two crossing stepped paths -->
    <path d="M34,40 L60,40 L60,66 L94,66 L94,92 L120,92 L120,118"
          fill="none" stroke="#00E0C6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M120,40 L94,40 L94,66 L60,66 L60,92 L34,92 L34,118"
          fill="none" stroke="#5B3CFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- circuit nodes at the joints -->
    <circle cx="34" cy="40" r="6" fill="#00E0C6"/>
    <circle cx="120" cy="118" r="6" fill="#00E0C6"/>
    <circle cx="120" cy="40" r="6" fill="#5B3CFF"/>
    <circle cx="34" cy="118" r="6" fill="#5B3CFF"/>
    <circle cx="60" cy="66" r="5" fill="#2A2E45"/>
    <circle cx="94" cy="66" r="5" fill="#2A2E45"/>
    <circle cx="94" cy="92" r="5" fill="#2A2E45"/>
    <circle cx="60" cy="92" r="5" fill="#2A2E45"/>
  </g>

  <!-- ================= WORDMARK ================= -->
  <g transform="translate(210,78)">
    <text x="0" y="0" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#1A1C2B">Xenon<tspan fill="#5B3CFF">Sec</tspan></text>
    <text x="2" y="30" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="4" fill="#6B7089">VM-BASED LUA OBFUSCATOR</text>
  </g>
</svg>
